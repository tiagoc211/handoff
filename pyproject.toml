[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-cli"
version = "0.1.0"
description = "Local CLI for persistent task handoffs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
handoff = "handoff.cli:main"
handoff-dashboard = "handoff.dashboard:main"

[tool.setuptools.packages.find]
include = ["handoff*"]

[tool.setuptools.package-data]
handoff = ["agent-workflow.md"]
