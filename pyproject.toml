[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-mcp"
version = "0.1.0"
description = "Small MCP server for persistent task handoffs"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
handoff-mcp = "handoff.server:main"
handoff-dashboard = "handoff.dashboard:main"

[tool.setuptools.packages.find]
include = ["handoff*"]

[tool.setuptools.package-data]
handoff = ["agent-workflow.md"]
